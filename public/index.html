<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Blueprint Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6',
              secondary: '#1e293b',
              dark: '#0f172a'
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      // Define the App component using CDN-loaded React
      function App() {
        const [activeTab, setActiveTab] = React.useState('new');
        const [concept, setConcept] = React.useState("");
        const [improvingConcept, setImprovingConcept] = React.useState(false);
        const [aiApiKey, setAiApiKey] = React.useState("");
        const [showApiKeyModal, setShowApiKeyModal] = React.useState(false);
        const [baseGenre, setBaseGenre] = React.useState("Pop");
        const [prodStyle, setProdStyle] = React.useState("Radio-Ready");
        
        const [selectedDna, setSelectedDna] = React.useState(["Synthpop", "Dream Pop", "Indie Pop"]);
        const [selectedInstruments, setSelectedInstruments] = React.useState(["808 Bass", "Tight Drums", "Synth Pads"]);
        const [selectedVoice, setSelectedVoice] = React.useState(["Bright", "Airy", "Powerful Belt"]);
        
        const [gender, setGender] = React.useState("Female");
        const [duetMode, setDuetMode] = React.useState(false);
        const [tempoEnabled, setTempoEnabled] = React.useState(false);
        const [weirdness, setWeirdness] = React.useState(10);
        const [styleInfluence, setStyleInfluence] = React.useState(80);

        const [isGenerating, setIsGenerating] = React.useState(false);
        const [generatedPrompt, setGeneratedPrompt] = React.useState(null);

        // Data constants
        const GENRES = ["Pop", "Rock", "Hip Hop", "Electronic", "R&B", "Jazz", "Country", "Classical"];
        const PRODUCTION_STYLES = ["Radio-Ready", "Lo-Fi", "Cinematic", "Live Recording", "Demo", "Underground"];

        const STYLE_DNA = [
          "Synthpop", "Dream Pop", "Indie Pop", "Hyperpop", "Art Pop", "2000s Pop",
          "Alternative Rock", "Indie Rock", "Punk Rock", "Grunge", "Shoegaze", "Psychedelic Rock",
          "House", "Techno", "Trance", "Drum and Bass", "Dubstep", "Trap", "R&B", "Soul", "Funk"
        ];

        const INSTRUMENTS = [
          "808 Bass", "Tight Drums", "Synth Pads", "Stratocaster", "Electric Guitar (Distorted)",
          "Downtuned Guitar", "Heavy Bass", "Turntables", "Bass Guitar", "Drum Kit",
          "Hi-Hat Rolls", "Sub Bass", "Dark Synth Pads", "Supersaw Lead", "Side-Chained Pads",
          "Synthesizer Arps", "Synthesizer", "Pad", "Cello", "Violin", "Violin Section",
          "Acoustic Guitar", "Acoustic Guitar (Nylon)", "Nylon Guitar", "Muted Guitar",
          "Fuzz Bass", "Piano", "Piano (Grand)", "Piano (Concert Grand)", "Piano (Jazz Voicings)",
          "Rhodes", "Hammond Organ", "Organ", "Saxophone", "Trumpet", "Brass", "Horn Section",
          "Congas", "Upright Bass", "Bass Guitar (Slap)", "Gospel Choir", "Choir",
          "Reverb Washes", "Field Recordings"
        ];

        const VOICE_DESCRIPTORS = [
          { icon: "☀️", label: "Bright" },
          { icon: "☁️", label: "Airy" },
          { icon: "🎤", label: "Powerful Belt" },
          { icon: "🌌", label: "Falsetto" },
          { icon: "💨", label: "Breathy" },
          { icon: "🤫", label: "Whispered" },
          { icon: "🔔", label: "Resonant" },
          { icon: "🎸", label: "Grit / Raspy" },
          { icon: "🔥", label: "Aggressive" },
          { icon: "😱", label: "Screaming" }
        ];

        // Toggle Component
        const Toggle = ({ checked, onChange, label, subLabel }) => (
          React.createElement('div', { className: "flex items-center justify-between p-3 bg-slate-800/50 rounded-xl border border-slate-700" },
            React.createElement('div', {},
              React.createElement('div', { className: "text-sm font-medium text-slate-200" }, label),
              subLabel && React.createElement('div', { className: "text-xs text-slate-400" }, subLabel)
            ),
            React.createElement('button', {
              onClick: () => onChange(!checked),
              className: `relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none ${
                checked ? 'bg-blue-600' : 'bg-slate-600'
              }`
            },
              React.createElement('span', {
                className: `inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${
                  checked ? 'translate-x-6' : 'translate-x-1'
                }`
              })
            )
          )
        );

        // Slider Component
        const Slider = ({ label, value, onChange, min = 0, max = 100, subLabel }) => (
          React.createElement('div', { className: "mb-6" },
            React.createElement('div', { className: "flex justify-between items-end mb-2" },
              React.createElement('div', {},
                React.createElement('label', { className: "text-sm font-semibold text-slate-300 block" }, label),
                subLabel && React.createElement('span', { className: "text-xs text-slate-500" }, subLabel)
              ),
              React.createElement('span', { className: "text-xs font-mono bg-slate-800 px-2 py-1 rounded text-blue-400 border border-slate-700" },
                `${value}%`
              )
            ),
            React.createElement('input', {
              type: "range",
              min: min,
              max: max,
              value: value,
              onChange: (e) => onChange(parseInt(e.target.value)),
              className: "w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400"
            })
          )
        );

        // TagCloud Component
        const TagCloud = ({ items, selected, onToggle, maxVisible = 6 }) => {
          const [expanded, setExpanded] = React.useState(false);
          
          const visibleItems = expanded ? items : items.slice(0, maxVisible);
          const hasMore = items.length > maxVisible;

          return React.createElement('div', { className: "mb-6" },
            React.createElement('div', { className: "flex justify-between items-center mb-3" },
              React.createElement('h3', { className: "text-sm font-bold text-slate-300 uppercase tracking-wider" },
                items === STYLE_DNA ? "Style DNA" : items === INSTRUMENTS ? "Key Instruments" : "Voice Descriptors"
              ),
              React.createElement('span', { className: "text-xs text-slate-500" }, "MULTI-SELECT")
            ),
            React.createElement('div', { className: "flex flex-wrap gap-2" },
              visibleItems.map((item, idx) => {
                const isSelected = selected.includes(typeof item === 'object' ? item.label : item);
                const label = typeof item === 'object' ? item.label : item;
                const icon = typeof item === 'object' ? item.icon : null;

                return React.createElement('button', {
                  key: label,
                  onClick: () => onToggle(label),
                  className: `
                    px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 border
                    ${isSelected 
                      ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-[0_0_10px_rgba(59,130,246,0.3)]' 
                      : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200'}
                  `,
                  style: { animation: 'none' } // Disable framer-motion animations
                },
                  icon && React.createElement('span', { className: "mr-1" }, icon),
                  label
                );
              })
            ),
            hasMore && React.createElement('button', {
              onClick: () => setExpanded(!expanded),
              className: "mt-2 text-xs text-slate-500 hover:text-blue-400 flex items-center gap-1 transition-colors"
            },
              expanded ? "Show Less" : `Show All (${items.length - maxVisible} more)`,
              React.createElement('span', { className: `transition-transform ${expanded ? 'rotate-180' : ''}` }, "▼")
            )
          );
        };

        // Handlers
        const toggleSelection = (list, setList, item) => {
          if (list.includes(item)) {
            setList(list.filter(i => i !== item));
          } else {
            setList([...list, item]);
          }
        };

        const handleGenerate = () => {
          setIsGenerating(true);
          
          // Simulate AI processing time
          setTimeout(() => {
            const prompt = `
[Genre: ${baseGenre}] [Style: ${prodStyle}]
[Concept: ${concept}]
[DNA: ${selectedDna.join(', ')}]
[Instruments: ${selectedInstruments.join(', ')}]
[Vocals: ${gender} - ${selectedVoice.join(', ')} ${duetMode ? '(Duet Mode)' : ''}]
[Settings: Weirdness ${weirdness}%, Style Adherence ${styleInfluence}%]
            `.trim();
            
            setGeneratedPrompt(prompt);
            setIsGenerating(false);
          }, 1500);
        };

        const copyToClipboard = () => {
          if (generatedPrompt) {
            navigator.clipboard.writeText(generatedPrompt);
            alert("Blueprint copied to clipboard!");
          }
        };

        // Return the JSX structure
        return React.createElement('div', { className: "min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-blue-500/30" },
          // Mobile Header Simulation
          React.createElement('div', { className: "sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between" },
            React.createElement('div', { className: "flex items-center gap-3" },
              React.createElement('div', { className: "w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold" }, "U"),
              React.createElement('span', { className: "font-semibold text-lg tracking-tight" }, "unoarchitect.com")
            ),
            React.createElement('div', { className: "flex gap-4 text-slate-400" },
              React.createElement('button', {}, "Share"),
              React.createElement('button', {}, "•••")
            )
          ),

          React.createElement('main', { className: "max-w-md mx-auto p-4 pb-24" },
            // Title Card
            React.createElement('div', { className: "flex justify-between items-center mb-6 mt-2" },
              React.createElement('h1', { className: "text-xl font-bold text-white" }, "Song Blueprint"),
              React.createElement('button', { className: "text-slate-500 hover:text-white" }, "✕")
            ),

            // Tabs
            React.createElement('div', { className: "flex bg-slate-900 p-1 rounded-xl mb-8 border border-slate-800" },
              React.createElement('button', {
                onClick: () => setActiveTab('new'),
                className: `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${
                  activeTab === 'new' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                }`
              },
                "Blueprint (New)"
              ),
              React.createElement('button', {
                onClick: () => setActiveTab('existing'),
                className: `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${
                  activeTab === 'existing' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                }`
              },
                "Refine (Existing)"
              )
            ),

            // Concept Input
            React.createElement('div', { className: "mb-8" },
              React.createElement('div', { className: "flex justify-between items-center mb-2" },
                React.createElement('label', { className: "text-xs font-bold text-slate-400 uppercase tracking-wider" }, "What is the song about?"),
                React.createElement('button', {
                  onClick: () => {
                    if (!concept.trim()) {
                      alert("Please enter a concept first.");
                      return;
                    }
                    alert("AI improvement requires an API key and network access. In this version, AI features are simulated.");
                  },
                  className: "text-xs text-blue-400 flex items-center gap-1 hover:text-blue-300"
                },
                  React.createElement('span', {}, "✨"),
                  "Improve with AI"
                )
              ),
              React.createElement('textarea', {
                value: concept,
                onChange: (e) => setConcept(e.target.value),
                className: "w-full bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all min-h-[120px] resize-none placeholder-slate-600",
                placeholder: "Describe your song idea..."
              })
            ),

            // Genre & Production
            React.createElement('div', { className: "grid grid-cols-2 gap-4 mb-8" },
              React.createElement('div', {},
                React.createElement('label', { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block" }, "Base Genre"),
                React.createElement('select', {
                  value: baseGenre,
                  onChange: (e) => setBaseGenre(e.target.value),
                  className: "w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 appearance-none"
                },
                  GENRES.map(g => React.createElement('option', { key: g, value: g }, g))
                )
              ),
              React.createElement('div', {},
                React.createElement('label', { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block" }, "Production Style"),
                React.createElement('select', {
                  value: prodStyle,
                  onChange: (e) => setProdStyle(e.target.value),
                  className: "w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 appearance-none"
                },
                  PRODUCTION_STYLES.map(s => React.createElement('option', { key: s, value: s }, s))
                )
              )
            ),

            // Multi-select Sections
            React.createElement(TagCloud, {
              items: STYLE_DNA,
              selected: selectedDna,
              onToggle: (item) => toggleSelection(selectedDna, setSelectedDna, item)
            }),
            
            React.createElement(TagCloud, {
              items: INSTRUMENTS,
              selected: selectedInstruments,
              onToggle: (item) => toggleSelection(selectedInstruments, setSelectedInstruments, item),
              maxVisible: 8
            }),

            React.createElement(TagCloud, {
              items: VOICE_DESCRIPTORS,
              selected: selectedVoice,
              onToggle: (item) => toggleSelection(selectedVoice, setSelectedVoice, item)
            }),

            // Voice Tailoring
            React.createElement('div', { className: "mb-8 pt-4 border-t border-slate-800" },
              React.createElement('h3', { className: "text-sm font-bold text-blue-400 uppercase tracking-wider mb-4" }, "Voice Tailoring"),
              
              React.createElement('div', { className: "mb-4" },
                React.createElement('label', { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block" }, "Gender / Type"),
                React.createElement('select', {
                  value: gender,
                  onChange: (e) => setGender(e.target.value),
                  className: "w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 appearance-none"
                },
                  React.createElement('option', {}, "Female"),
                  React.createElement('option', {}, "Male"),
                  React.createElement('option', {}, "Androgynous"),
                  React.createElement('option', {}, "Child"),
                  React.createElement('option', {}, "Elderly")
                )
              ),

              React.createElement(Toggle, {
                label: "Duet Mode",
                subLabel: "Alternating male/female vocals",
                checked: duetMode,
                onChange: setDuetMode
              })
            ),

            // Sliders
            React.createElement('div', { className: "mb-8" },
              React.createElement('div', { className: "flex justify-between items-center mb-4" },
                 React.createElement('label', { className: "text-sm font-bold text-slate-300" }, "Tempo / BPM"),
                 React.createElement('button', {
                   onClick: () => setTempoEnabled(!tempoEnabled),
                   className: `relative inline-flex h-5 w-9 items-center rounded-full transition-colors ${tempoEnabled ? 'bg-blue-600' : 'bg-slate-700'}`
                 },
                   React.createElement('span', {
                     className: `inline-block h-3 w-3 transform rounded-full bg-white transition-transform ${tempoEnabled ? 'translate-x-5' : 'translate-x-1'}`
                   })
                 )
              ),
              tempoEnabled && React.createElement('div', { className: "space-y-4" },
                React.createElement(Slider, {
                  label: "BPM",
                  value: 120,
                  onChange: () => {},
                  min: 60,
                  max: 180
                }),
                React.createElement(Slider, {
                  label: "Range",
                  value: 50,
                  onChange: () => {},
                  min: 0,
                  max: 100
                })
              ),
              React.createElement(Slider, {
                label: "Weirdness",
                value: weirdness,
                onChange: setWeirdness,
                subLabel: "Experimental elements"
              }),
              React.createElement(Slider, {
                label: "Style Influence",
                value: styleInfluence,
                onChange: setStyleInfluence,
                subLabel: "How much to follow selected styles"
              })
            ),

            // Generate Button
            React.createElement('div', { className: "fixed bottom-4 left-4 right-4 max-w-md mx-auto px-4" },
              React.createElement('button', {
                onClick: handleGenerate,
                disabled: isGenerating,
                className: `w-full py-4 px-6 rounded-2xl font-bold text-white transition-all shadow-lg ${
                  isGenerating 
                    ? 'bg-blue-800 cursor-not-allowed' 
                    : 'bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 active:scale-[0.98]'
                }`
              },
                isGenerating ? React.createElement('span', { className: "flex items-center justify-center gap-2" },
                  React.createElement('span', { className: "animate-spin" }, "⚙️"),
                  "Generating..."
                ) : "Generate Song Blueprint"
              )
            ),

            // Generated Prompt Display
            generatedPrompt && React.createElement('div', { className: "mt-8 p-4 bg-slate-900/50 rounded-xl border border-slate-800" },
              React.createElement('div', { className: "flex justify-between items-center mb-3" },
                React.createElement('h3', { className: "font-bold text-slate-300" }, "Generated Blueprint"),
                React.createElement('button', {
                  onClick: copyToClipboard,
                  className: "text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition-colors"
                },
                  "Copy"
                )
              ),
              React.createElement('pre', { 
                className: "text-xs text-slate-400 whitespace-pre-wrap break-words font-mono bg-slate-950 p-4 rounded-lg border border-slate-800 overflow-x-auto" 
              },
                generatedPrompt
              )
            )
          )
        );
      }

      // Render the app
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(React.createElement(App));
    </script>
  </body>
</html>
